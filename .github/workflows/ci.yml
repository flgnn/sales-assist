name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Uji otomatis + cakupan (ambang 70%)
        run: npm run test:coverage
      - name: Evaluasi mesin rekomendasi (baseline vs hibrida)
        run: node scripts/eval-recommender.js --split=all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sales-assist:ci .

  zap-baseline:
    # Pemindaian pasif OWASP ZAP pada instance uji milik sendiri (sistem berizin).
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan aplikasi
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-zap-secret-ci-zap-secret-ci-zap-secret/' .env
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fs http://localhost:3001/api/health && break || sleep 2; done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3001
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
      - run: docker compose down -v
