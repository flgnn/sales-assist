name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Uji otomatis + cakupan (ambang 70%)
        run: npm run test:coverage
      - name: Evaluasi mesin rekomendasi (baseline vs hibrida)
        run: node scripts/eval-recommender.js --split=all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sales-assist:ci .
